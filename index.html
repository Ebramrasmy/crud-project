<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
  <div class="container  p-5 ">
        <div class="w-75 mx-auto my-5">
        <div class="form-group">
          <label for="productName" >product Name :</label>
          <input type="text" class="my-2 form-control" id="productName" placeholder="Enter productName">
          <small class="text-muted">product Name must be char only</small>
        </div>
        <div class="form-group">
          <label for="productPrice" >productPrice :</label>
          <input type="text" class="my-2 form-control" id="productPrice" placeholder="Enter productPrice">
      </div>
        <div class="form-group">
          <label for="productCategory" >product Catoegory :</label>
          <input type="text" class="my-2 form-control" id="productCategory" placeholder="Enter productCategory">
      </div>
        <div class="form-group">
          <label for="productDescription" >product Description :</label>
          <textarea type="text" class="my-2 form-control" id="productDescription" placeholder="Enter productDescription"> </textarea>
      </div>
      <button onclick="addProduct()" id="addp" class="my-3 btn btn-outline-info">Add Product</button>
        
  </div>
  </div>
