<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebram Rasmy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container my-5">
  <div class="card shadow-lg p-4 border-0 rounded-4">
    <h3 class="mb-4 text-center fw-bold text-primary">Add New Product</h3>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="productName" class="form-label">Product Name</label>
        <input type="text" id="productName" class="form-control form-control-lg">
      </div>

      <div class="col-md-6">
        <label for="productPrice" class="form-label">Price</label>
        <input type="number" id="productPrice" class="form-control form-control-lg">
      </div>

      <div class="col-md-6">
        <label for="productCategory" class="form-label">Category</label>
        <input type="text" id="productCategory" class="form-control form-control-lg">
      </div>

      <div class="col-md-6">
        <label for="productDescription" class="form-label">Description</label>
        <input type="text" id="productDescription" class="form-control form-control-lg">
      </div>

      <div class="col-12 text-center mt-3">
        <button onclick="addProduct()" class="btn btn-outline-primary px-5 py-2 fs-5 rounded-3">Add Product</button>
      </div>
    </div>
  </div>
</div>
      
<div class="container my-5">
  <div class="card shadow-lg border-0 rounded-4">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-primary text-center">
        <tr>
          <th>#</th>
          <th>Product</th>
          <th>Price</th>
          <th>Category</th>
          <th>Description</th>
          <th colspan="2">Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody" class="text-center"></tbody>
    </table>
  </div>
</div>
 
    
<script src="js/script.js"></script>  
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html
